{% extends "libros/base.html" %}
{% block titulo %}Borrar {{ libro.titulo }}{% endblock %}
{% block contenido %}
<h1>¿Seguro que querés borrar «{{ libro.titulo }}»?</h1>
<p>No se puede deshacer.</p>
<form method="post">
    {% csrf_token %}
    <button>Sí, borrar</button>
    <a href="{% url 'libros:detalle' libro.pk %}">No, volver</a>
</form>
{% endblock %}
